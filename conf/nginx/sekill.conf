server {
    listen       80;
    server_name  seckill.lzhcf.dpdns.org;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api/ {
        proxy_pass http://gateway:8180/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        root /;
        # 1. 定义合法的来源 (Referer)
        # none: 允许直接访问（如直接在浏览器打开图片链接）
        # blocked: 允许被防火墙或代理隐藏了来源的请求
        # seckill.lzhcf.dpdns.org: 只允许你的域名及其子域名
        valid_referers none blocked seckill.lzhcf.dpdns.org *.lzhcf.dpdns.org;

        # 2. 如果来源不合法，返回 403 Forbidden
        if ($invalid_referer) {
           return 403;
        }
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
