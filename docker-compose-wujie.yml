version: "3"

services:
  # seckill:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: lzh/seckill:latest
  #   container_name: seckill
  #   # restart: always
  #   environment:
  #     - TZ=Asia/Shanghai
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - seckill
  #   depends_on:
  #     - mysql
  #     - redis
  #     - rabbitmq
  redis:
    image: redis
    container_name: redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - /root/mydocker/redis/conf/redis.conf:/etc/redis/redis.conf
      - /root/mydocker/redis/data:/data
      - /root/mydocker/redis/log:/var/log/redis
    networks:
      - seckill
    command: redis-server /etc/redis/redis.conf
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      # - MYSQL_DATABASE=seckill
    ports:
      - "3306:3306"
    volumes:
      - /root/mydocker/mysql/data:/var/lib/mysql
      - /root/mydocker/mysql/log:/var/log/mysql
      - /root/mydocker/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - seckill
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci'
    ]
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    hostname: rabbitserver
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - /root/mydocker/rabbitmq/log:/var/log/rabbitmq
      - /root/mydocker/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - seckill
  nginx:
    image: nginx:1.18.0
    container_name: nginx
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NGINX_PORT=80
    ports:
      - 80:80
      - 443:443
    volumes:
      - /root/mydocker/nginx/html:/usr/share/nginx/html
      - /root/mydocker/nginx/log:/var/log/nginx
      - /root/mydocker/nginx/conf.d:/etc/nginx/conf.d
    privileged: true
    networks:
      - seckill
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: always
    ports:
      # web 界面访问端口
      - 8848:8848
      # 程序使用 grpc 连接的端口
      - 9848:9848
    environment:
      - TZ=Asia/Shanghai
      - MODE=standalone
    volumes:
      - /root/mydocker/nacos/conf/application.properties:/home/nacos/conf/application.properties
      - /root/mydocker/nacos/logs:/home/nacos/logs
      - /root/mydocker/nacos/data:/home/nacos/data
    networks:
      - seckill

networks:
  seckill:
    driver: bridge
