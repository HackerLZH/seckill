services:
  gateway:
    build:
      context: ./gateway-8080
      dockerfile: Dockerfile-prod
    image: lzh/gateway:latest
    container_name: gateway
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
      - PORT=${GATEWAY_PORT:-8080}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - seckill
    depends_on:
      nacos:
        condition: service_healthy
  auth:
    build:
      context: ./auth-service-8082
      dockerfile: Dockerfile-prod
    image: lzh/auth:latest
    container_name: auth
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
      - PORT=${AUTH_SERVICE_PORT:-8082}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
    ports:
      - "${AUTH_SERVICE_PORT:-8082}:8082"
    networks:
      - seckill
  seckill:
    build:
      context: ./seckill-service-8081
      dockerfile: Dockerfile-prod
    image: lzh/seckill:latest
    container_name: seckill
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
      - PORT=${SECKILL_SERVICE_PORT:-8081}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
    ports:
      - "${SECKILL_SERVICE_PORT:-8081}:8081"
    networks:
      - seckill
  admin:
    build:
      context: ./admin-service-8083
      dockerfile: Dockerfile-prod
    image: lzh/admin:latest
    container_name: admin
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
      - PORT=${ADMIN_SERVICE_PORT:-8083}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
    ports:
      - "${ADMIN_SERVICE_PORT:-8083}:8083"
    networks:
      - seckill
  redis:
    image: redis
    container_name: redis
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - /www/seckill/docker/redis/conf/redis.conf:/etc/redis/redis.conf
      - /www/seckill/docker/redis/data:/data
      - /www/seckill/docker/redis/log:/var/log/redis
    networks:
      - seckill
    command: redis-server /etc/redis/redis.conf
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - /www/seckill/docker/mysql/data:/var/lib/mysql
      - /www/seckill/docker/mysql/log:/var/log/mysql
      - /www/seckill/docker/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - seckill
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci'
    ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: no
    mem_limit: ${SERVICE_MEM_LIMIT:-512m}
    hostname: rabbitserver
    environment:
      - TZ=Asia/Shanghai
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=rabbitmq123456
    ports:
      - "${RABBITMQ_WEB_PORT:-15672}:15672"
      - "${RABBITMQ_CON_PORT:-5672}:5672"
    volumes:
      - /www/seckill/docker/rabbitmq/log:/var/log/rabbitmq
      - /www/seckill/docker/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - seckill
  nginx:
    image: nginx:1.18.0
    container_name: nginx
    restart: no
    environment:
      - TZ=Asia/Shanghai
      - NGINX_PORT=${NGINX_HTTP_PORT:-80}
    ports:
      - ${NGINX_HTTP_PORT:-80}:80
      - ${NGINX_HTTPS_PORT:-443}:443
    volumes:
      - /www/seckill/docker/nginx/html:/usr/share/nginx/html
      - /www/seckill/docker/nginx/log:/var/log/nginx
      - /www/seckill/docker/nginx/conf.d:/etc/nginx/conf.d
    privileged: true
    networks:
      - seckill
    depends_on:
      nacos:
        condition: service_healthy
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos
    restart: no
    mem_limit: ${NACOS_MEM_LIMIT:-1g}
    ports:
      # web 界面访问端口
      - "8848:8848"
      # 程序使用 grpc 连接的端口
      - "9848:9848"
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - MODE=standalone
      - NACOS_AUTH_TOKEN=r1hVjHGtVhZdGyEqBHpJ1u24aMWFU9ueCac0zf4XTKk=
      - NACOS_AUTH_IDENTITY_KEY=nacoskey
      - NACOS_AUTH_IDENTITY_VALUE=nacosvalue
      - JVM_XMS=${NACOS_JVM_XMS:-1g}
      - JVM_XMX=${NACOS_JVM_XMX:-1g}
      - JVM_XMN=${NACOS_JVM_XMN:-512m}
      - JVM_MS=${NACOS_JVM_MS:-128m}
      - JVM_MMS=${NACOS_JVM_MMS:-320m}
    volumes:
      - /www/seckill/docker/nacos/conf/application.properties:/home/nacos/conf/application.properties
      - /www/seckill/docker/nacos/logs:/home/nacos/logs
      - /www/seckill/docker/nacos/data:/home/nacos/data
    networks:
      - seckill
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8848' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
networks:
  seckill:
    driver: bridge
