<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .code {
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-top: 16px;
      color: #0f172a;
    }

    .desc {
      font-size: 15px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.6;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background: #fff;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 32px;
      font-size: 13px;
      color: #94a3b8;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e2e8f0;
      }
      .title { color: #f1f5f9; }
      .desc { color: #94a3b8; }
      .btn-secondary {
        background: #1e293b;
        color: #cbd5e1;
        border-color: #334155;
      }
      .btn-secondary:hover {
        background: #334155;
      }
      .hint { color: #64748b; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1 class="title">页面未找到</h1>
    <p class="desc">
      抱歉，你访问的页面不存在或已被移除。<br>
      请检查网址是否正确，或返回首页继续浏览。
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">← 返回首页</a>
      <button onclick="history.back()" class="btn btn-secondary">返回上一页</button>
    </div>

    <p class="hint">错误代码：404 Not Found</p>
  </div>
</body>
</html>
