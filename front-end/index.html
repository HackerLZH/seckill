<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀平台 - 限时特惠</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- 修改导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-bolt"></i> 用户秒杀平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">首页</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="#" class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#loginModal" id="loginBtn">
                        <i class="fas fa-user"></i> 登录
                    </a>
                    <div class="dropdown" id="userMenu" style="display: none;">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> <span id="usernameDisplay"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user-circle"></i> 用户信息</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-shopping-cart"></i> 购物车</a></li>
                            <li id="seckillManageItem" style="display: none;"><a class="dropdown-item" href="#"><i class="fas fa-cog"></i> 秒杀管理</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 添加登录/注册模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="login-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-bs-dismiss="modal">没有账号？立即注册</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="register-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="register-password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认密码</label>
                            <input type="password" class="form-control" id="register-confirm-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改主要内容 -->
    <div class="container my-5">
        <div class="seckill-banner text-center">
            <h1><i class="fas fa-stopwatch"></i> 用户秒杀平台</h1>
            <p class="lead">提交你的商品，参与秒杀活动</p>
        </div>

        <!-- <div class="text-center mb-4">
            <button class="btn btn-primary" id="submit-product-btn">
                <i class="fas fa-plus"></i> 提交秒杀商品
            </button>
        </div> -->

        <!-- 修改秒杀商品列表 -->
        <h2 class="mb-4"><i class="fas fa-fire text-danger"></i> 当前秒杀</h2>
        <div class="row" id="current-seckill-products">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>

        <!-- 即将开始的秒杀 -->
        <h2 class="mb-4 mt-5"><i class="fas fa-clock text-warning"></i> 即将开始</h2>
        <div class="row" id="upcoming-seckill-products">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>
    </div>

    <!-- 添加页面底部 -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>
                        <a href="https://beian.miit.gov.cn" target="_blank" class="beian-link">鄂ICP备2025137084号-1</a>
                    </p>
                    <div class="footer-links mb-2">
                        <a href="#">友情链接1</a>
                        <a href="#">友情链接2</a>
                        <a href="#">友情链接3</a>
                    </div>
                    <p class="text-muted">2025 lzhfancyweb.site 用户秒杀平台</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.staticfile.net/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
