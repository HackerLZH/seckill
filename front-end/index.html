<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀平台 - 限时特惠</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .seckill-banner {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .countdown {
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }
        .product-card {
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .original-price {
            text-decoration: line-through;
            color: #6c757d;
        }
        .seckill-price {
            color: #dc3545;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .progress-thin {
            height: 5px;
        }
        .seckill-btn {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            border: none;
            font-weight: bold;
        }
        .seckill-btn:hover {
            opacity: 0.9;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .hot-item {
            animation: pulse 2s infinite;
        }
        /* 底部样式 */
        .footer {
            background-color: #f8f9fa;
            padding: 2rem 0;
            margin-top: 2rem;
            border-top: 1px solid #dee2e6;
        }
        .footer-links a {
            text-decoration: none;
            color: #6c757d;
            margin-right: 1rem;
        }
        .footer-links a:hover {
            color: #000;
        }
        .beian-link {
            color: #6c757d;
            text-decoration: none;
        }
        .beian-link:hover {
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 修改导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-bolt"></i> 用户秒杀平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="submit-product">提交商品</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="#" class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#loginModal" id="loginBtn">
                        <i class="fas fa-user"></i> 登录
                    </a>
                    <div class="dropdown" id="userMenu" style="display: none;">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> <span id="usernameDisplay"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user-circle"></i> 用户信息</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-shopping-cart"></i> 购物车</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 添加登录/注册模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="login-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-bs-dismiss="modal">没有账号？立即注册</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="register-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="register-password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认密码</label>
                            <input type="password" class="form-control" id="register-confirm-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改主要内容 -->
    <div class="container my-5">
        <div class="seckill-banner text-center">
            <h1><i class="fas fa-stopwatch"></i> 用户秒杀平台</h1>
            <p class="lead">提交你的商品，参与秒杀活动</p>
        </div>

        <!-- <div class="text-center mb-4">
            <button class="btn btn-primary" id="submit-product-btn">
                <i class="fas fa-plus"></i> 提交秒杀商品
            </button>
        </div> -->

        <!-- 修改秒杀商品列表 -->
        <h2 class="mb-4"><i class="fas fa-fire text-danger"></i> 当前秒杀</h2>
        <div class="row" id="current-seckill-products">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>

        <!-- 即将开始的秒杀 -->
        <h2 class="mb-4 mt-5"><i class="fas fa-clock text-warning"></i> 即将开始</h2>
        <div class="row" id="upcoming-seckill-products">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>
    </div>

    <!-- 添加页面底部 -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>
                        <a href="https://beian.miit.gov.cn" target="_blank" class="beian-link">鄂ICP备2025137084号-1</a>
                    </p>
                    <div class="footer-links mb-2">
                        <a href="#">友情链接1</a>
                        <a href="#">友情链接2</a>
                        <a href="#">友情链接3</a>
                    </div>
                    <p class="text-muted">2025 lzhfancyweb.site 用户秒杀平台</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
        // 页面加载时获取商品数据
        $(document).ready(function() {
            fetchSeckillProducts();
        });

        // 获取秒杀商品数据
        function fetchSeckillProducts() {
            // 这里应该替换为实际的API端点
            $.ajax({
                url: '/api/seckill/products',
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    renderProducts(response.data.current, 'current-seckill-products');
                    renderProducts(response.data.upcoming, 'upcoming-seckill-products');
                },
                error: function(xhr, status, error) {
                    console.error('获取商品数据失败:', error);
                }
            });
        }

        // 渲染商品列表
        function renderProducts(products, containerId) {
            const container = $('#' + containerId);
            container.empty();
            products.forEach(product => {
                const productCard = $('<div>').addClass('col-md-4');
                productCard.html(createProductCardHTML(product, containerId));
                container.append(productCard);
            });
        }

        // 创建商品卡片HTML
        function createProductCardHTML(product, containerId) {
            if (containerId === 'current-seckill-products') {
                // 当前秒杀商品卡片
                const soldPercent = Math.round((product.stock - product.availableStock) / product.stock * 100);
                return `
                    <div class="card product-card">
                        <img src="${product.image}" class="card-img-top" alt="${product.name}">
                        <div class="card-body">
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text">
                                <span class="original-price">¥${product.price - 2000}</span>
                                <span class="seckill-price ms-2">¥${product.price}</span>
                            </p>
                            <div class="progress progress-thin mb-2">
                                <div class="progress-bar bg-danger" style="width: ${soldPercent}%"></div>
                            </div>
                            <small class="text-muted">已售${soldPercent}%，仅剩${product.availableStock}件</small>
                            <button class="btn seckill-btn w-100 mt-2" onclick="checkLogin()">立即秒杀</button>
                        </div>
                    </div>
                `;
            } else {
                // 即将开始的秒杀商品卡片
                return `
                    <div class="card product-card">
                        <div class="card-header bg-light">
                            ${new Date(product.startTime).toLocaleString()} 开始
                        </div>
                        <img src="${product.image}" class="card-img-top" alt="${product.name}">
                        <div class="card-body">
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text">
                                <span class="original-price">¥${product.price - 2000}</span>
                                <span class="seckill-price ms-2">¥${product.price}</span>
                            </p>
                            <button class="btn btn-outline-secondary w-100" disabled>即将开始</button>
                        </div>
                    </div>
                `;
            }
        }

        var token_key = 'SeckillAuthorization';

        function checkLogin() {
            // 检查是否存在SeckillAuthorization令牌
            const token = localStorage.getItem(token_key);
            if(!token) { // 如果没有令牌，则显示登录模态框
                $('#loginModal').modal('show');
                return false;
            }
            // 执行秒杀逻辑
        }

        $('#loginForm').submit(function(e) {
            e.preventDefault();

            const username = $("#login-username").val();
            const password = $("#login-password").val();

            $.ajax({
                url: '/api/auth/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    password: password
                }),
                success: function(response) {
                    alert('登录成功');
                    $('#loginModal').modal('hide');
                    $('#loginForm')[0].reset();
                    // 隐藏登录按钮，显示用户菜单
                    $('#loginBtn').hide();
                    $('#usernameDisplay').text(response.data.username);
                    $('#userMenu').show();
                    // 保存令牌到localStorage
                    localStorage.setItem('token', response.data.token);
                },
                error: function(xhr, status, error) {
                    alert('登录失败: ' + (xhr.responseJSON ? xhr.responseJSON.message : '未知错误'));
                }
            });

        });
        
        $('#registerForm').submit(function(e) {
            e.preventDefault();

            const username = $("#register-username").val();
            const password = $("#register-password").val();
            const confirmPassword = $("#register-confirm-password").val();
            
            // 简单验证密码
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            if (password.length < 6) {
                alert('密码长度至少6个字符');
                return;
            }
            
            // 发送注册请求
            $.ajax({
                url: '/api/auth/register',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    password: password
                }),
                success: function(response) {
                    alert('注册成功');
                    // 关闭注册模态框
                    $('#registerModal').modal('hide');
                    // 清空表单
                    $('#registerForm')[0].reset();
                },
                error: function(xhr, status, error) {
                    alert('注册失败: ' + (xhr.responseJSON ? xhr.responseJSON.message : '未知错误'));
                }
            });
        });

        // 登出功能
        $('#logoutBtn').click(function(e) {
            e.preventDefault();
            $.ajax({
                url: '/api/auth/logout',
                method: 'POST',
                headers: {
                    [token_key]: localStorage.getItem('token')
                },
                success: function(response) {
                    // 清除本地存储的令牌
                    localStorage.removeItem('token');
                    // 隐藏用户菜单，显示登录按钮
                    $('#userMenu').hide();
                    $('#loginBtn').show();
                    alert('已退出登录');
                },
                error: function(xhr, status, error) {
                    alert('登出失败:' + (xhr.responseJSON ? xhr.responseJSON.message : '未知错误'));
                }
            })
        });
    </script>
</body>
</html>
